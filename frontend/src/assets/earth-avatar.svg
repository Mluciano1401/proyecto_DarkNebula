<svg id="earth-avatar-pro" viewBox="0 0 500 500" width="100%" height="100%" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <!-- Integración en la app: los ids de <defs> llevan prefijo "ea-" (había un "globe-clip"
       en la cabecera) y los selectores del <style> van bajo #earth-avatar-pro, porque al
       insertarse en línea este <style> es global. El diseño visual no cambia. -->
  <defs>
    <!-- Fondo Espacial -->
    <radialGradient id="ea-space-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="55%" stop-color="#061224" />
      <stop offset="100%" stop-color="#02060d" />
    </radialGradient>

    <!-- Brillo Atmosférico Exterior -->
    <radialGradient id="ea-atmo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#00e5ff" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#00ff87" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>

    <!-- Océano Profundo con Iluminación Superior Izquierda -->
    <radialGradient id="ea-ocean-sphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#03396c" />
      <stop offset="100%" stop-color="#011627" />
    </radialGradient>

    <!-- Sombra Esférica 3D sobre la Tierra -->
    <radialGradient id="ea-planet-shadow" cx="32%" cy="28%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="85%" stop-color="#020617" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.82" />
    </radialGradient>

    <!-- Degradado de Continentes (Verde vibrante y dorado desértico) -->
    <linearGradient id="ea-land-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#4ade80" />
      <stop offset="85%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Degradado Metálico Azul/Cian para Auriculares -->
    <linearGradient id="ea-metal-headphone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Degradado Auroras Boreales -->
    <linearGradient id="ea-aurora-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <!-- Filtro Neón para Auroras y Ecualizador -->
    <filter id="ea-neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Máscara Circular del Planeta -->
    <clipPath id="ea-globe-clip">
      <circle cx="250" cy="255" r="145" />
    </clipPath>
  </defs>

  <style>
    #earth-avatar-pro {
      --beat: 1;
      --aurora-scale: 1;
    }

    /* 1. Animación de Auroras Ondulantes (Estilo Ecualizador Orbital) */
    @keyframes auroraWave1 {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
      25% { transform: scale(1.07) rotate(4deg); opacity: 1; }
      50% { transform: scale(0.97) rotate(-3deg); opacity: 0.75; }
      75% { transform: scale(1.05) rotate(2deg); opacity: 0.95; }
    }

    @keyframes auroraWave2 {
      0%, 100% { transform: scale(1.04) rotate(0deg); opacity: 0.65; }
      33% { transform: scale(0.95) rotate(-5deg); opacity: 0.9; }
      66% { transform: scale(1.09) rotate(5deg); opacity: 0.55; }
    }

    @keyframes auroraWave3 {
      0%, 100% { transform: scale(0.98) rotate(2deg); opacity: 0.45; }
      50% { transform: scale(1.12) rotate(-6deg); opacity: 0.85; }
    }

    /* Auroras y auriculares escalan desde el centro del planeta (coordenadas del viewBox). */
    #earth-avatar-pro #aurora-ring-1 {
      transform-origin: 250px 255px;
      animation: auroraWave1 2.4s ease-in-out infinite;
    }
    #earth-avatar-pro #aurora-ring-2 {
      transform-origin: 250px 255px;
      animation: auroraWave2 3.1s ease-in-out infinite;
    }
    #earth-avatar-pro #aurora-ring-3 {
      transform-origin: 250px 255px;
      animation: auroraWave3 1.8s ease-in-out infinite;
    }

    /* 2. Rotación Continua de Continentes y Nubes */
    @keyframes spinContinents {
      from { transform: translateX(0px); }
      to { transform: translateX(-290px); }
    }

    @keyframes spinClouds {
      from { transform: translateX(0px); }
      to { transform: translateX(-290px); }
    }

    #earth-avatar-pro #continents-track {
      animation: spinContinents 22s linear infinite;
    }

    #earth-avatar-pro #clouds-track {
      animation: spinClouds 15s linear infinite;
    }

    /* 3. Pulso de los Auriculares al Ritmo */
    @keyframes headphoneBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.035); }
      30% { transform: scale(0.99); }
      45% { transform: scale(1.02); }
    }

    #earth-avatar-pro #headphones-group {
      transform-origin: 250px 245px;
      animation: headphoneBeat 1.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    /* 4. Barras del Ecualizador en la Copa del Auricular (crecen desde su base) */
    @keyframes eqBar {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }

    #earth-avatar-pro .eq-line {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: eqBar 0.6s ease-in-out infinite;
    }
    #earth-avatar-pro .eq-1 { animation-delay: 0.0s; }
    #earth-avatar-pro .eq-2 { animation-delay: 0.15s; }
    #earth-avatar-pro .eq-3 { animation-delay: 0.3s; }
    #earth-avatar-pro .eq-4 { animation-delay: 0.1s; }
    #earth-avatar-pro .eq-5 { animation-delay: 0.25s; }

    /* 5. Parpadeo de Estrellas (cada una escala sobre sí misma) */
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    #earth-avatar-pro .star {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 3s ease-in-out infinite;
    }
    #earth-avatar-pro .s2 { animation-delay: 1s; }
    #earth-avatar-pro .s3 { animation-delay: 2s; }

    /* Modo Interactivo por JavaScript (Audio Real) */
    #earth-avatar-pro.audio-reactive #aurora-ring-1 {
      animation: none;
      transform: scale(var(--aurora-scale));
      transition: transform 0.06s ease-out;
    }
    #earth-avatar-pro.audio-reactive #headphones-group {
      animation: none;
      transform: scale(var(--beat));
      transition: transform 0.05s ease-out;
    }
    #earth-avatar-pro.audio-reactive .eq-line {
      animation: none;
    }
  </style>

  <!-- FONDO ESPACIAL Y NEBULOSA -->
  <rect width="500" height="500" rx="40" fill="url(#ea-space-bg)" />
  <circle cx="250" cy="255" r="225" fill="url(#ea-atmo-glow)" />

  <!-- ESTRELLAS -->
  <g fill="#ffffff">
    <circle class="star" cx="65" cy="80" r="2" />
    <circle class="star s2" cx="430" cy="95" r="2.5" fill="#7dd3fc" />
    <circle class="star s3" cx="85" cy="410" r="2" />
    <circle class="star" cx="415" cy="400" r="2.2" fill="#a7f3d0" />
    <circle class="star s2" cx="140" cy="45" r="1.5" />
    <circle class="star s3" cx="370" cy="55" r="1.8" />
    <circle class="star" cx="45" cy="240" r="1.5" />
    <circle class="star s2" cx="455" cy="270" r="2" fill="#38bdf8" />
  </g>

  <!-- AURORAS BOREALES ONDULANTES (Múltiples capas concéntricas) -->
  <g id="auroras-container" filter="url(#ea-neon-glow)" fill="none" stroke-linecap="round">
    <!-- Onda Principal Intensa -->
    <path id="aurora-ring-1" stroke="url(#ea-aurora-stroke)" stroke-width="5" d="
      M 250,65
      C 275,65 288,42 310,55 C 332,68 338,95 362,102 C 386,109 408,98 418,122
      C 428,146 408,168 422,192 C 436,216 462,225 455,252 C 448,279 422,285 418,312
      C 414,339 435,362 415,382 C 395,402 368,385 345,402 C 322,419 318,448 290,450
      C 262,452 255,425 228,425 C 201,425 188,455 162,445 C 136,435 142,405 118,392
      C 94,379 68,392 55,368 C 42,344 65,320 55,295 C 45,270 22,258 28,230
      C 34,202 62,198 68,172 C 74,146 52,122 72,102 C 92,82 118,98 142,85
      C 166,72 175,48 202,52 C 225,55 232,65 250,65 Z" />

    <!-- Onda Secundaria Translúcida -->
    <path id="aurora-ring-2" stroke="#00ff87" stroke-width="2.5" stroke-opacity="0.7" d="
      M 250,52
      C 282,52 298,32 322,48 C 346,64 348,88 375,95 C 402,102 422,92 432,118
      C 442,144 420,172 435,198 C 450,224 475,232 465,262 C 455,292 430,295 425,322
      C 420,349 442,375 420,395 C 398,415 372,395 348,415 C 324,435 318,462 288,462
      C 258,462 250,435 222,435 C 194,435 182,465 155,452 C 128,439 135,410 110,395
      C 85,380 58,395 45,368 C 32,341 55,315 45,288 C 35,261 12,248 20,218
      C 28,188 55,185 62,158 C 69,131 48,108 70,88 C 92,68 118,88 145,72
      C 172,56 182,38 210,42 C 232,45 235,52 250,52 Z" />

    <!-- Onda Terciaria Cian -->
    <path id="aurora-ring-3" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" d="
      M 250,76
      C 272,76 285,55 305,68 C 325,81 330,105 352,112 C 374,119 395,110 405,132
      C 415,154 398,175 410,196 C 422,217 445,225 438,250 C 431,275 408,280 405,305
      C 402,330 420,350 402,368 C 384,386 360,372 338,388 C 316,404 312,430 288,432
      C 264,434 256,410 232,410 C 208,410 195,436 172,428 C 149,420 152,392 130,380
      C 108,368 82,380 70,358 C 58,336 78,314 68,290 C 58,266 38,255 44,230
      C 50,205 75,200 80,176 C 85,152 66,130 84,112 C 102,94 126,108 148,96
      C 170,84 180,62 204,66 C 225,69 232,76 250,76 Z" />
  </g>

  <!-- PLANETA TIERRA -->
  <g id="earth-globe">
    <!-- Base Océano -->
    <circle cx="250" cy="255" r="145" fill="url(#ea-ocean-sphere)" />

    <!-- Continentes y Nubes en Movimiento (Doble patrón para bucle infinito) -->
    <g clip-path="url(#ea-globe-clip)">
      <!-- Continentes (América, África/Europa + repetición para giro continuo) -->
      <g id="continents-track" fill="url(#ea-land-grad)" opacity="0.92">
        <!-- Bloque 1 -->
        <path d="M 135,140 Q 165,125 195,145 T 215,185 Q 190,205 175,215 Q 205,230 225,255 Q 235,295 205,345 Q 185,375 175,355 Q 165,305 155,275 Q 145,245 165,220 Q 140,200 125,175 Z" />
        <path d="M 225,112 Q 255,108 272,125 Q 255,142 235,138 Z" fill="#f8fafc" />
        <path d="M 295,185 Q 335,175 365,205 Q 385,235 355,285 Q 340,325 325,315 Q 315,275 295,255 Q 275,230 295,185 Z" />
        <path d="M 305,130 Q 345,120 365,145 Q 350,168 315,165 Z" />

        <!-- Bloque 2 (Desplazado +290px para bucle sin cortes) -->
        <path d="M 425,140 Q 455,125 485,145 T 505,185 Q 480,205 465,215 Q 495,230 515,255 Q 525,295 495,345 Q 475,375 465,355 Q 455,305 445,275 Q 435,245 455,220 Q 430,200 415,175 Z" />
        <path d="M 515,112 Q 545,108 562,125 Q 545,142 525,138 Z" fill="#f8fafc" />
        <path d="M 585,185 Q 625,175 655,205 Q 675,235 645,285 Q 630,325 615,315 Q 605,275 585,255 Q 565,230 585,185 Z" />
        <path d="M 595,130 Q 635,120 655,145 Q 640,168 605,165 Z" />
      </g>

      <!-- Capa de Nubes Atmosféricas -->
      <g id="clouds-track" fill="#ffffff" opacity="0.38">
        <ellipse cx="220" cy="180" rx="45" ry="12" transform="rotate(-15 220 180)" />
        <ellipse cx="160" cy="290" rx="55" ry="14" transform="rotate(20 160 290)" />
        <ellipse cx="310" cy="240" rx="40" ry="10" transform="rotate(-10 310 240)" />
        <!-- Repetición +290px -->
        <ellipse cx="510" cy="180" rx="45" ry="12" transform="rotate(-15 510 180)" />
        <ellipse cx="450" cy="290" rx="55" ry="14" transform="rotate(20 450 290)" />
        <ellipse cx="600" cy="240" rx="40" ry="10" transform="rotate(-10 600 240)" />
      </g>
    </g>

    <!-- Sombra 3D y Brillo Atmosférico del Borde -->
    <circle cx="250" cy="255" r="145" fill="url(#ea-planet-shadow)" />
    <circle cx="250" cy="255" r="144" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-opacity="0.65" />
  </g>

  <!-- AURICULARES FUTURISTAS -->
  <g id="headphones-group">
    <!-- Almohadilla Izquierda (Vista lateral en el borde izquierdo) -->
    <g transform="rotate(-12 102 238)">
      <rect x="86" y="192" width="24" height="92" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <rect x="94" y="198" width="14" height="80" rx="7" fill="url(#ea-metal-headphone)" />
    </g>

    <!-- Diadema Superior Metálica -->
    <path d="M 102,202 C 102,95 178,68 258,72 C 338,76 392,125 398,205" fill="none" stroke="#0f172a" stroke-width="22" stroke-linecap="round" />
    <path d="M 102,202 C 102,95 178,68 258,72 C 338,76 392,125 398,205" fill="none" stroke="url(#ea-metal-headphone)" stroke-width="16" stroke-linecap="round" />
    <!-- Reflejo de luz en la diadema -->
    <path d="M 122,165 C 135,98 192,76 258,79 C 318,82 362,115 380,165" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Copa Derecha Principal (Perspectiva 3D) -->
    <g id="right-earcup">
      <!-- Almohadilla acolchada contra la Tierra -->
      <ellipse cx="372" cy="260" rx="28" ry="62" transform="rotate(10 372 260)" fill="#0f172a" stroke="#1e293b" stroke-width="3" />
      <!-- Pliegues de la almohadilla -->
      <path d="M 364,215 Q 354,230 362,245 M 360,255 Q 350,270 358,285 M 358,290 Q 352,302 360,312" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

      <!-- Carcasa Exterior Metálica -->
      <ellipse cx="392" cy="262" rx="34" ry="58" transform="rotate(10 392 262)" fill="url(#ea-metal-headphone)" stroke="#bae6fd" stroke-width="2" />

      <!-- Pantalla LED Interior con Forma Poligonal (Del boceto original) -->
      <path d="M 382,226 L 404,228 L 418,262 L 400,296 L 378,292 Z" fill="#020617" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Ecualizador Animado Dentro del Auricular -->
      <g filter="url(#ea-neon-glow)" stroke="#00ff87" stroke-width="2.5" stroke-linecap="round">
        <line class="eq-line eq-1" x1="386" y1="248" x2="386" y2="276" />
        <line class="eq-line eq-2" x1="392" y1="240" x2="392" y2="284" />
        <line class="eq-line eq-3" x1="398" y1="236" x2="398" y2="288" />
        <line class="eq-line eq-4" x1="404" y1="244" x2="404" y2="280" />
        <line class="eq-line eq-5" x1="410" y1="252" x2="410" y2="272" />
      </g>
    </g>
  </g>
</svg>
